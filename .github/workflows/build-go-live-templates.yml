name: Build and Push Go Live Templates

on:
  push:
    paths:
      - 'docs/unternehmen/starter-kits/go-live.md'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract sections and build templates
        run: |
          mkdir -p dist/craft dist/kirby

          sed -n '/^## Allgemein/,/^## /{ /^## Craft/d; /^## Kirby/d; p }' \
            docs/unternehmen/starter-kits/go-live.md > dist/shared.md

          cat << 'EOF' > dist/craft/go-live.md
          ---
          name: Go Live Checklist
          about: Aufgaben vor dem Launch
          labels: go-live
          ---
          EOF
          cat dist/shared.md >> dist/craft/go-live.md
          sed -n '/^## Craft CMS/,/^## /{ /^## Kirby/d; p }' \
            docs/unternehmen/starter-kits/go-live.md >> dist/craft/go-live.md

          cat << 'EOF' > dist/kirby/go-live.md
          ---
          name: Go Live Checklist
          about: Aufgaben vor dem Launch
          labels: go-live
          ---
          EOF
          cat dist/shared.md >> dist/kirby/go-live.md
          sed -n '/^## Kirby CMS/,$ p' \
            docs/unternehmen/starter-kits/go-live.md >> dist/kirby/go-live.md

      - name: Push to Craft repo
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.GO_LIVE_ISSUE_TEMPLATES }}
        with:
          source-directory: dist/craft
          destination-github-username: profitlich-ch
          destination-repository-name: template-craftcms
          target-directory: .github/ISSUE_TEMPLATE
          target-branch: main

      - name: Push to Kirby repo
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.GO_LIVE_ISSUE_TEMPLATES }}
        with:
          source-directory: dist/kirby
          destination-github-username: profitlich-ch
          destination-repository-name: template-kirbycms
          target-directory: .github/ISSUE_TEMPLATE
          target-branch: main